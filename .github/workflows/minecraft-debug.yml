name: 管理员本机调试验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: [java_1_20_5, java_26_3_plus]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/mc-debug
          shared-key: mc-debug
      - run: cargo test --manifest-path src-tauri/mc-debug/Cargo.toml --locked
      - name: 官方服务端实测（正常、错误、长指令、取消与重新开启）
        env:
          MC_DEBUG_VERSION: ${{ matrix.version }}
        run: cargo test --manifest-path src-tauri/mc-debug/Cargo.toml --locked --test live -- --ignored --nocapture
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib
